[pytest]
testpaths = tests
pythonpath = .
# Windows %TEMP% 上的 pytest-of-* 目录可能因 ACL 被拒绝访问，
# 通过 --basetemp 将临时根目录固定在项目内（已在 .gitignore 中忽略）。
addopts = -q --basetemp=.pytest_tmp

# Python 3.12+ 的 sqlite3 模块弃用了默认 datetime 适配器（DeprecationWarning 来自
# 标准库与 SQLAlchemy 的兼容层，非本项目代码；SQLAlchemy 后续版本会迁移）。
filterwarnings =
    ignore:The default datetime adapter is deprecated as of Python 3.12:DeprecationWarning
